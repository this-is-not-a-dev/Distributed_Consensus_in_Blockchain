name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & build (${{ matrix.deck }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deck:
          - PPTs/Blockchain_Concepts/Distributed_Consensus_in_Blockchain
          - PPTs/Pathshala/ShipLabs
    defaults:
      run:
        working-directory: ${{ matrix.deck }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build

  site:
    name: Build site (hub + all decks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun scripts/build-site.mjs
      - name: Check hub manifest
        run: test "$(jq '.decks | length' _site/decks.json)" -ge 1
